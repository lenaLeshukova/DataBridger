[project]
name = "databridger"
version = "0.1.0"
description = ""
authors = [
    { name = "Leshukova Elena", email = "e-redina@ya.ru" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "yfinance (>=1.2.0,<2.0.0)",
    "numpy (<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
exclude = '''.git'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
